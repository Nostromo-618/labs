<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Local checked streaming and speech QA</title>
  <body>
    <p>Explicit local model/audio validation.</p>
    <button id="play">Play representative audio</button>
    <script type="module">
      import { AiChat, MODEL_OPTIONS, PRIMARY_MODEL_OPTIONS } from '@vanduo-oss/vwl-ai-chat';
      import { chatRuntimeOptions, clearChatCaches } from '/src/lib/chat-runtime.js';
      import { createSpeechRuntime } from '/src/lib/speech/runtime.js';
      import { SpeechSession } from '/src/lib/speech/session.js';
      import { createPCMPlayer, speakSystem } from '/src/lib/speech/audio.js';
      import { localEnglishVoices } from '/src/lib/speech/text.js';
      import { KOKORO_VOICES } from '/src/lib/speech/voices.js';
      window.checkedQA = {
        AiChat,
        MODEL_OPTIONS,
        PRIMARY_MODEL_OPTIONS,
        chatRuntimeOptions,
        clearChatCaches,
        createSpeechRuntime,
        SpeechSession,
        createPCMPlayer,
        speakSystem,
        localEnglishVoices,
        KOKORO_VOICES,
      };
      document.querySelector('#play').onclick = () => {
        const c = new AbortController();
        const player = createPCMPlayer(c.signal);
        window.playTask = (async () => {
          try {
            for (const pcm of window.output.chunks)
              await player.play(pcm, window.output.sampleRate);
          } finally {
            player.cancel();
          }
        })();
      };
    </script>
  </body>
</html>
