<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Chat lifecycle fixture</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      import { createApp, h } from 'vue';
      import { VanduoVue } from '@vanduo-oss/vd3';
      import '@vanduo-oss/vd3/css';
      import '/src/styles/legacy-bridge.css';
      import Chat from '/src/components/VwlAiChatUI.vue';
      import { AiChat } from '@vanduo-oss/vwl-ai-chat';
      let history = [],
        pending = null;
      window.chatQA = {
        calls: [],
        loads: 0,
        canceled: 0,
        unmount: () => app.unmount(),
        finish: () => pending?.(),
      };
      let chat = {
        modelId: new URLSearchParams(location.search).get('model') || 'gemma-4-E2B-it-web',
        setModelId: async (id) => {
          chat.modelId = id;
        },
        load: async () => {
          window.chatQA.loads++;
        },
        setSystemPromptOptions: (options) => {
          window.chatQA.instructions = options;
        },
        isLoaded: () => !new URLSearchParams(location.search).has('model'),
        onProgress: () => () => {},
        getHistory: () => history.map((m) => ({ ...m })),
        setHistory: async (h) => {
          history = h;
        },
        reset() {
          this.cancel();
          history = [];
        },
        cancel() {
          window.chatQA.canceled++;
          pending?.(true);
        },
        async generate(text, options) {
          window.chatQA.calls.push({
            text,
            maxOutputTokens: options.maxOutputTokens,
            delivery: options.delivery,
          });
          if (text === 'hold')
            return new Promise((resolve, reject) => {
              pending = (stop) => {
                pending = null;
                if (stop) reject(new DOMException('Stopped', 'AbortError'));
                else resolve('Late response');
              };
            });
          if (text === 'preview') {
            options.onPreview?.(
              '**Checked** <img src=x onerror=window.injected=1> [link](https://example.com)',
            );
            await new Promise((resolve) => {
              pending = () => {
                pending = null;
                resolve();
              };
            });
            options.onPreview?.('');
          }
          const answer =
            text === 'preview'
              ? '**Checked** [link](https://example.com)'
              : text === 'html'
                ? '<img src=x onerror="window.injected=1">'
                : 'Answer: ' + text;
          options.onUpdate?.(answer);
          history.push({ role: 'user', content: text }, { role: 'assistant', content: answer });
          return answer;
        },
      };
      const ready = new Set();
      window.speechQA = {
        transcript: 'dictated text',
        denied: false,
        hold: false,
        cancels: 0,
        loads: [],
        spoken: [],
        finish: null,
      };
      const speechOptions = {
        runtime: {
          isLoaded: (kind) => ready.has(kind),
          async load(kind) {
            window.speechQA.loads.push(kind);
            if (window.speechQA.holdLoad)
              await new Promise((resolve) => {
                window.speechQA.finish = resolve;
              });
            ready.add(kind);
          },
          async resetVad() {},
          async transcribe() {
            if (window.speechQA.hold)
              return new Promise((resolve) => {
                window.speechQA.finish = () => resolve(window.speechQA.transcript);
              });
            return window.speechQA.transcript;
          },
          async synthesize(text) {
            window.speechQA.spoken.push(text);
            if (window.speechQA.holdNeural)
              return new Promise((resolve) => {
                window.speechQA.finish = () =>
                  resolve({ chunks: [new Float32Array([0.1])], sampleRate: 24000 });
              });
            return { chunks: [new Float32Array([0.1])], sampleRate: 24000 };
          },
          cancel() {
            window.speechQA.cancels++;
          },
          dispose() {
            ready.clear();
          },
        },
        async recorderFactory() {
          if (window.speechQA.denied)
            throw new DOMException('Microphone permission denied', 'NotAllowedError');
          return {
            stop: async () => new Float32Array(1600),
            cancel: () => window.speechQA.cancels++,
          };
        },
        playerFactory: () => ({
          play: async (_pcm, _rate, options) => options?.onStart?.(),
          cancel() {},
        }),
        async systemSpeaker(text, _voice, signal) {
          window.speechQA.spoken.push(text);
          return new Promise((resolve, reject) => {
            signal.addEventListener(
              'abort',
              () => reject(new DOMException('Stopped', 'AbortError')),
              { once: true },
            );
            window.speechQA.finish = resolve;
          });
        },
      };
      window.conversationQA = { captures: 0, stops: 0, utterance: null };
      const conversationOptions = {
        preflight() {},
        async requestMicrophone() {
          if (window.speechQA.denied) throw new Error('Microphone permission denied');
          return {
            getTracks: () => [
              {
                stop() {
                  window.conversationQA.stops++;
                },
              },
            ],
          };
        },
        async captureFactory({ onUtterance }) {
          window.conversationQA.captures++;
          window.conversationQA.utterance = (limit = false) =>
            onUtterance({ audio: new Float32Array(16000), limit });
          return {
            cancel() {
              window.conversationQA.stops++;
            },
          };
        },
        delay: async () => {},
      };
      if (new URLSearchParams(location.search).has('checked')) {
        chat = new AiChat();
        chat._isLoaded = true;
        chat.engine = {
          createConversation: async () => ({
            async *sendMessageStreaming() {
              yield { content: [{ type: 'text', text: 'This is fuc' }] };
              await new Promise((resolve) => setTimeout(resolve, 50));
              yield { content: [{ type: 'text', text: 'king awful.' }] };
            },
            delete: async () => {},
          }),
        };
        window.chatQA.history = () => chat.getHistory();
      }
      const app = createApp({
        render: () => h(Chat, { chat, speechOptions, conversationOptions }),
      });
      app.use(VanduoVue, { storagePrefix: 'vwl-' });
      app.mount('#app');
    </script>
  </body>
</html>
