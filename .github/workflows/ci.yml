name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Labs dogfoods sibling vdl-* repos via link:../vdl-*. Check them out beside
# labs/ and build dist/ (gitignored) before install/test/build.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v7
        with:
          path: labs

      - name: Checkout vdl-cbun
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-cbun
          ref: ec67960defcaba2869333e22690254e85f70fdc5
          path: vdl-cbun

      - name: Checkout vdl-hybrid-search
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-hybrid-search
          ref: 214d6f4b6c44795f03d15cfcedcd7667d26f2f5b
          path: vdl-hybrid-search

      - name: Checkout vdl-ai-chat
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-ai-chat
          ref: 8cf0af8ae4721780620eb48a5bcb511000cf2b00
          path: vdl-ai-chat

      - name: Checkout vdl-hex-earth
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-hex-earth
          ref: 5664284a453aad3a97ba566868c0caf8aa23eed6
          path: vdl-hex-earth

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: |
            labs/pnpm-lock.yaml
            vdl-cbun/pnpm-lock.yaml
            vdl-hybrid-search/pnpm-lock.yaml
            vdl-ai-chat/pnpm-lock.yaml
            vdl-hex-earth/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in vdl-cbun vdl-hybrid-search vdl-ai-chat vdl-hex-earth; do
            echo "::group::Build $pkg"
            pnpm install --frozen-lockfile --dir "$pkg"
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright unit + e2e
        run: pnpm exec playwright test --project="Chromium Desktop"
        env:
          CI: true

      - name: Format and lint
        run: pnpm format:check && pnpm lint

      - name: Build site
        run: pnpm build

      - name: Assert tests and smoke demos are not in dist
        run: |
          if [ -d dist/tests ]; then
            echo "dist/tests must not be published" >&2
            exit 1
          fi
          if ls dist/demo/gemma-* >/dev/null 2>&1; then
            echo "dist must not include gemma smoke demos" >&2
            exit 1
          fi
          test ! -d dist/models
          test ! -d dist/qa
          if find dist/assets -name "*VdlLocalEvaluation*" | grep -q .; then
            echo "Local evaluation must not be published" >&2
            exit 1
          fi
          test -f dist/CNAME
          grep -qx 'labs.vanduo.dev' dist/CNAME
