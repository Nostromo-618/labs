name: CI

on:
  push:
    branches: [main, master]
  pull_request:

# Labs dogfoods sibling vwl-* repos via link:../vwl-*. Check them out beside
# labs/ and build dist/ (gitignored) before install/test/build.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v7
        with:
          path: labs

      - name: Checkout vwl-cbun
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vwl-cbun
          ref: 9db112b0bbc2c0ddc9d72818c422c311d35f2623
          path: vwl-cbun

      - name: Checkout vwl-hybrid-search
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vwl-hybrid-search
          ref: 01ff2c2eba19cab43bb2a77c6771b781c4ee4bd7
          path: vwl-hybrid-search

      - name: Checkout vwl-ai-chat
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vwl-ai-chat
          ref: d518433afea7d60fbca90777d0258dd4217dfc58
          path: vwl-ai-chat

      - name: Checkout vwl-hex-earth
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vwl-hex-earth
          ref: fe97ecdedf413700663a234186963f25d793e70c
          path: vwl-hex-earth

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.34.6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: |
            labs/pnpm-lock.yaml
            vwl-cbun/pnpm-lock.yaml
            vwl-hybrid-search/pnpm-lock.yaml
            vwl-ai-chat/pnpm-lock.yaml
            vwl-hex-earth/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in vwl-cbun vwl-hybrid-search vwl-ai-chat vwl-hex-earth; do
            echo "::group::Build $pkg"
            if [ "$pkg" = vwl-hex-earth ]; then
              # The pinned Git dependency needs its allowlisted prepack build.
              pnpm install --frozen-lockfile --ignore-scripts=false --dir "$pkg"
            else
              pnpm install --frozen-lockfile --dir "$pkg"
            fi
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright unit + e2e
        run: pnpm exec playwright test --project="Chromium Desktop"
        env:
          CI: true

      - name: Format and lint
        run: pnpm format:check && pnpm lint

      - name: Build site
        run: pnpm build

      - name: Assert tests and smoke demos are not in dist
        run: |
          if [ -d dist/tests ]; then
            echo "dist/tests must not be published" >&2
            exit 1
          fi
          if ls dist/demo/gemma-* >/dev/null 2>&1; then
            echo "dist must not include gemma smoke demos" >&2
            exit 1
          fi
          test ! -d dist/models
          test ! -d dist/qa
          if find dist/assets -name "*VwlLocalEvaluation*" | grep -q .; then
            echo "Local evaluation must not be published" >&2
            exit 1
          fi
          test -f dist/CNAME
          grep -qx 'labs.vanduo.dev' dist/CNAME
