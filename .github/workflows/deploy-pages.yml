name: Deploy static content to Pages

# Labs dogfoods sibling vdl-* repos via link:../vdl-*. Check them out beside
# labs/ and build dist/ (gitignored) before install/build/deploy.

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs
    steps:
      - name: Checkout Labs
        uses: actions/checkout@v7
        with:
          path: labs
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Checkout vdl-cbun
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-cbun
          ref: ec67960defcaba2869333e22690254e85f70fdc5
          path: vdl-cbun

      - name: Checkout vdl-hybrid-search
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-hybrid-search
          ref: 214d6f4b6c44795f03d15cfcedcd7667d26f2f5b
          path: vdl-hybrid-search

      - name: Checkout vdl-ai-chat
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-ai-chat
          ref: 8cf0af8ae4721780620eb48a5bcb511000cf2b00
          path: vdl-ai-chat

      - name: Checkout vdl-hex-earth
        uses: actions/checkout@v7
        with:
          repository: vanduo-oss/vdl-hex-earth
          ref: 432b61fb7b2f569e48e33a548f71589290b2ecdb
          path: vdl-hex-earth

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24.17.0
          cache: pnpm
          cache-dependency-path: |
            labs/pnpm-lock.yaml
            vdl-cbun/pnpm-lock.yaml
            vdl-hybrid-search/pnpm-lock.yaml
            vdl-ai-chat/pnpm-lock.yaml
            vdl-hex-earth/pnpm-lock.yaml

      - name: Install and build Labs siblings
        working-directory: ${{ github.workspace }}
        run: |
          for pkg in vdl-cbun vdl-hybrid-search vdl-ai-chat vdl-hex-earth; do
            echo "::group::Build $pkg"
            pnpm install --frozen-lockfile --dir "$pkg"
            pnpm run --dir "$pkg" build
            echo "::endgroup::"
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: labs/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
