schema: spec-driven

context: |
  Project: vanduo web labs (@vanduo-oss/labs) — experimental Vue demo playground.

  Naming (labs-owned):
  - Prefix labs UI/components/CSS/product ids with `vwl` / `Vwl` / `vwl-`
    (e.g. VwlAiChatUI, VwlHybridSearchUI, .vwl-ai-*, .vwl-neptune-*, vwl-ai-chat).
  - Do NOT rename `@vanduo-oss/vd3` or its design-system API (`VdButton`, `VdCard`,
    `VdModal`, `--vd-*` tokens, `.vd-btn` / `.vd-glass` / etc.). Those stay `vd` / `Vd`.
  - Do NOT rewrite vd3-docs corpus content in `data/search-index.json` / fixtures.

  Architecture:
  - Engines come from npm: `@vanduo-oss/vwl-hybrid-search` (`HybridSearch`) and
    `@vanduo-oss/vwl-ai-chat` (`AiChat` + markdown). Labs does NOT publish engines
    and MUST NOT reintroduce local engine SoT forks.
  - Labs Vue shell: Vite + Vue 3 + `@vanduo-oss/vd3` (`src/App.vue`, `src/components/Vwl*.vue`).
  - Guardrails: package subpaths (`…/guardrails/llm`, `…/guardrails/search`, …).
  - Default AI path: LiteRT Gemma (WebLLM fallback). Inject `loadLiteRT` / `loadFuse` /
    `loadTransformers` in demos. Local model mirrors under `.models/` (dev-served at
    `/models/…`; never ship into dist). Fetch with `pnpm models:fetch`.
  - Hybrid corpus: regenerate with `pnpm index` (`utils/hybrid-search-indexer.mjs`).

  Key paths:
  - UI: `src/components/VwlAiChatUI.vue`, `src/components/VwlHybridSearchUI.vue`
  - Docs: `doc/vwl-hybrid-search.md`, `doc/vwl-ai-chat.md`, `doc/vwl-guardrails.md`, `README.md`
  - Tests: `tests/unit/*.spec.ts`, `tests/e2e/vwl-neptune-search.spec.ts` (Playwright)
  - Demos: `demo/*`, `src/demos/*`

  Testing: `pnpm test` (Playwright). Prefer focused unit specs when changing demos/harnesses.

rules:
  proposal:
    - Call out whether the change touches labs `vdl` surface vs `@vanduo-oss/vd3` APIs
    - Prefer small deltas; do not boil the ocean with brownfield backfill
  specs:
    - Use Given/When/Then scenarios for observable behavior
    - Keep `vd3` / design-system references explicit when relevant
  tasks:
    - Include a verification step (`pnpm test` or a focused Playwright/unit file)

operations:
  apply:
    guidance:
      - Prefer focused unit tests before full Playwright when possible
      - Do not commit unless the user asks
  archive:
    guidance:
      - Keep the completion summary concise
