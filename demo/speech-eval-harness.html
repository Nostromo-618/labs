<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Local speech evaluation</title>
  </head>
  <body>
    <h1>Local speech evaluation</h1>
    <p>
      Local QA only. Loads pinned speech models when Run is clicked. Results are kept in this page.
    </p>
    <label
      ><input id="with-chat" type="checkbox" /> Load default Gemma model alongside speech (~2
      GB)</label
    >
    <button id="run">Run speech evaluation</button>
    <label
      ><input id="remote" type="checkbox" /> Download pinned models from Hugging Face (ignore local
      mirrors)</label
    >
    <button id="stop">Stop and release</button>
    <button id="microphone">Record microphone (3 seconds)</button>
    <button id="play">Play synthesized test phrase</button>
    <button id="system">Play local system voice</button>
    <pre id="status" role="status">Ready</pre>
    <div id="summary"></div>
    <pre id="results"></pre>
    <script type="module" src="/src/demos/speech-eval-harness.js"></script>
  </body>
</html>
